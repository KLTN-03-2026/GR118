### 4.2 Authentication Flow

\`\`\`mermaid
sequenceDiagram
    participant Client
    participant Server
    participant DB
    Client->>Server: POST /auth/login {email, password}
    Server->>DB: Find user by email
    DB-->>Server: User document
    Server->>Server: bcrypt.compare(password, hash)
    Server->>Server: generateTokens(userId, roleIds)
    Note right of Server: Access Token: 15min<br/>Refresh Token: 7 days
    Server-->>Client: { accessToken, refreshToken, user }
    Note left of Client: Store tokens in cookies
    Client->>Server: GET /api/v1/issues (with accessToken)
    Server->>Server: isAuthenticated middleware<br/>jwt.verify(token)
    Server->>Server: checkPermission("issues", "read")
    Server-->>Client: { issues: [...] }
\`\`\`

### 4.3 RBAC (Role-Based Access Control) — 5 bảng

\`\`\`
User → UserRole → Role → RolePermission → Permission → PermissionAction → Action + Resource
\`\`\`

Middleware \`checkPermission(resource, action)\`:
1. Lấy \`roleIds\` từ JWT token
2. Sync Resource nếu chưa tồn tại
3. Sync Action nếu chưa tồn tại
4. Tìm Permission IDs từ Role
5. Kiểm tra Permission có Action tương ứng → Allow/Deny

## 5. MODULE AI — KIẾN TRÚC 3 TẦNG

### 5.1 Pipeline phân tích ảnh

\`\`\`mermaid
graph TD
    A[Upload Image] --> B{Knowledge Cache?}
    B -->|Cache Hit<br/>Hamming < 10| C[Return Cached Result]
    B -->|Cache Miss| D{Gemini API Available?}
    D -->|Yes| E[Gemini 1.5 Flash<br/>Cloud Analysis]
    D -->|No / Error| F[MobileNet v2<br/>Local Fallback]
    E --> G{Confidence > 80%?}
    G -->|Yes| H[Save to Knowledge + Dataset]
    G -->|No| I[Return Result]
    F --> J[Return Local Result]
    H --> I
\`\`\`

### 5.2 Perceptual Hashing (Image Fingerprint)
- Sử dụng **blockhash-core** (pHash) tính fingerprint 64-bit hex
- So sánh **Hamming Distance** < 10 → coi là ảnh giống nhau
- Tránh phân tích lại ảnh trùng lặp → tăng tốc response

### 5.3 Content Moderation (3 layers)

| Layer | Công nghệ | Mục đích |
|-------|----------|----------|
| Layer 1 | Local Profanity Filter | Danh sách từ khóa tục tĩu (VN + EN) |
| Layer 2 | GPT-4o-mini | Semantic analysis: tục tĩu, spam, quảng cáo, off-topic |
| Layer 3 | Fallback | Nếu API lỗi → chỉ dùng Layer 1 |

### 5.4 Các model AI sử dụng

| Model | Vai trò | Ưu điểm | Nhược điểm |
|-------|---------|---------|------------|
| **Gemini 1.5 Flash** | Cloud image analysis chính | Chính xác cao, hiểu ngữ cảnh VN | Cần API key, phụ thuộc internet |
| **MobileNet v2** (TF.js) | Local fallback | Chạy offline, nhanh | Độ chính xác thấp hơn cho urban context |
| **CLIP** (OpenAI, Python) | Zero-shot classification | Phân loại không cần train | Nặng, cần GPU |
| **GPT-4o-mini** | Kiểm duyệt nội dung | Hiểu ngữ nghĩa sâu | Chi phí API |

## 6. BẢO MẬT

| Biện pháp | Chi tiết |
|-----------|----------|
| **Password Hashing** | bcrypt (salt rounds mặc định) |
| **JWT Tokens** | Access Token (15 phút) + Refresh Token (7 ngày) |
| **CORS Policy** | Whitelist origins (localhost + production domains) |
| **Rate Limiting** | General: 1000 req/15min, Auth: 50 req/15min, Password: 10 req/hour |
| **RBAC** | 5-table permission system (Resource → Action → Permission → Role → User) |
| **OTP** | Email-based OTP for password reset (hashed storage) |
| **File Validation** | Multer filter (image/video only, max 20MB) + Magic number check |
| **Input Validation** | Mongoose enum validation cho category, status |
| **Content Moderation** | 3-layer AI-based filter (profanity + semantic + fallback) |
| **Account Locking** | Temporary (24h, 3 days, 1 month) hoặc Permanent ban |

## 8. CÂU HỎI PHẢN BIỆN THƯỜNG GẶP & GỢI Ý TRẢ LỜI

### Q1: "Tại sao chọn MongoDB thay vì SQL (MySQL/PostgreSQL)?"
> MongoDB phù hợp vì: (1) Dữ liệu Issue có cấu trúc linh hoạt (nested arrays: verifications, comments, processingHistory), (2) Schema-less giúp mở rộng trường dễ dàng khi yêu cầu thay đổi, (3) Tương thích tốt với JSON response trong REST API, (4) MongoDB Atlas cung cấp free tier phù hợp đồ án.

### Q2: "Tại sao dùng React Context thay vì Redux/Zustand?"
> Hệ thống có 6 Context Providers (Auth, Issues, Activities, Notifications, Permissions, Roles). Quy mô ứng dụng vừa phải, Context API đủ đáp ứng mà không cần thêm dependency. Nếu scale lớn hơn, có thể migrate sang Zustand.

### Q3: "Module AI hoạt động offline được không?"
> Có. Hệ thống có **3 tầng fallback**: (1) Knowledge Cache (Perceptual Hash) → (2) Gemini Cloud → (3) MobileNet v2 local. Nếu mất internet, MobileNet v2 (TensorFlow.js) vẫn phân loại được ảnh với 8 nhóm vấn đề đô thị.

### Q4: "Độ chính xác của AI như thế nào?"
> Gemini 1.5 Flash đạt confidence >90% cho các trường hợp điển hình (rác thải, ngập lụt, ổ gà). MobileNet v2 local thấp hơn (~60-80%) do là general-purpose model. Hệ thống có cơ chế **self-learning**: ảnh có confidence >80% từ Gemini được tự động lưu vào dataset để train lại model local (train.py với Transfer Learning từ MobileNetV2).

### Q5: "Hệ thống phân quyền RBAC hoạt động thế nào?"
> Sử dụng **5 bảng**: Resources → Actions → Permissions → Roles → Users. Middleware \`checkPermission(resource, action)\` kiểm tra tại mỗi API endpoint. Ví dụ: \`checkPermission("issues", "update")\` → lấy roleIds từ JWT → tìm permissions → kiểm tra có action "update" trên resource "issues" hay không.

### Q6: "Tại sao cần managementScope cho Cán bộ?"
> Trong thực tế, mỗi cán bộ chỉ phụ trách một lĩnh vực cụ thể (ví dụ: cán bộ ngập lụt chỉ xử lý báo cáo ngập lụt). \`managementScope\` lưu danh sách category mà cán bộ quản lý, frontend lọc issues hiển thị dựa trên scope này. Cơ chế fallback: nếu user không có scope riêng → kế thừa từ Role.

### Q7: "Hệ thống có xử lý concurrent access không?"
> MongoDB cung cấp atomic operations cho single document updates. Với hệ thống này (quy mô cấp phường/quận), concurrent conflicts hiếm xảy ra. Nếu cần scale, có thể thêm Optimistic Locking với \`__v\` version field của Mongoose.

### Q8: "Content Moderation có chặn được hết nội dung xấu không?"
> Hệ thống sử dụng **3 lớp bảo vệ**: (1) Local keyword filter — nhanh, zero cost, chặn từ khóa hiển nhiên; (2) GPT-4o-mini semantic analysis — hiểu ngữ cảnh, phát hiện lách luật; (3) Fallback an toàn nếu API lỗi. Không đảm bảo 100% nhưng đạt mức độ chấp nhận được cho ứng dụng đô thị.

### Q9: "Tại sao chọn Express 5 thay vì NestJS?"
> Express 5 nhẹ và linh hoạt, phù hợp quy mô đồ án. NestJS có nhiều boilerplate hơn, phù hợp cho doanh nghiệp lớn. Dự án đã tự implement các pattern cần thiết: Repository pattern, DTO mapping, Middleware chain, Error handling — đảm bảo codebase có tổ chức tốt.

### Q10: "File upload lưu ở đâu? Có giới hạn gì?"
> Media files được upload qua Multer (memory storage) → push lên **Cloudflare R2** (S3-compatible). Giới hạn: 20MB/file, chỉ chấp nhận image/video (kiểm tra MIME type + magic bytes). R2 cho free 10GB/tháng, phù hợp đồ án.

### Q11: "Hệ thống có responsive không?"
> Có. Frontend sử dụng TailwindCSS responsive utilities (\`sm:\`, \`md:\`, \`lg:\`) và Flexbox/Grid layout. Tất cả 20 pages đều responsive trên mobile, tablet, desktop.

### Q12: "Tại sao có cả Node.js và Python trong AI module?"
> Node.js (index.js) là server chính xử lý API + Gemini + MobileNet. Python (classifier.py + train.py) dùng cho: (1) CLIP model — zero-shot classification chính xác hơn, và (2) Training script với Transfer Learning (MobileNetV2 + Keras). Hai ngôn ngữ bổ trợ nhau: Node.js cho production serving, Python cho ML research/training.

### Q13: "Perceptual Hashing là gì và tại sao dùng?"
> Perceptual Hashing (pHash) tạo "fingerprint" 64-bit cho mỗi ảnh. Ảnh giống nhau (dù resize, nén) có hash gần giống nhau (Hamming Distance < 10). Dùng để: (1) Tránh phân tích lại ảnh trùng → tiết kiệm API call, (2) Phát hiện ảnh duplicate trong báo cáo spam.

### Q14: "Luồng xử lý báo cáo (Processing Workflow) như thế nào?"
> 6 bước: \`pending\` → \`received\` (Cán bộ tiếp nhận) → \`assigned\` (Phân công) → \`processing\` (Đang xử lý) → \`need_info\` (Yêu cầu bổ sung) hoặc \`resolved\`/\`rejected\`. Mỗi bước lưu vào \`processingHistory[]\` với actorId, note, timestamp — tạo thành **audit trail** đầy đủ.

## 8.2 CÂU HỎI VỀ SCRUM / AGILE

### Q-S1: "Nhóm có áp dụng Scrum trong quá trình phát triển không?"
> Có. Nhóm áp dụng **Scrum** với các Sprint 2 tuần. Mỗi Sprint bao gồm đầy đủ 4 buổi lễ (Ceremonies): **Sprint Planning** (lập kế hoạch đầu sprint), **Daily Standup** (đồng bộ tiến độ hằng ngày), **Sprint Review** (demo sản phẩm cuối sprint), và **Sprint Retrospective** (cải thiện quy trình). Backlog được quản lý trên **GitHub Projects/Trello** với các User Story được ước lượng bằng Story Points.

### Q-S2: "Nhóm có bao nhiêu thành viên? Vai trò Scrum được phân công thế nào?"
> Nhóm gồm **2 thành viên** (phù hợp với quy mô đồ án tốt nghiệp). Do nhóm nhỏ nên vai trò được điều chỉnh linh hoạt:
> - **Product Owner (PO)**: Giảng viên hướng dẫn — định hướng tính năng và ưu tiên.
> - **Scrum Master kiêm Developer**: Thành viên 1 — quản lý sprint, phát triển Backend & AI.
> - **Developer**: Thành viên 2 — phát triển Frontend & tích hợp hệ thống.
> Cả hai thành viên cùng tham gia tất cả các ceremonies và đóng góp vào Product Backlog.

### Q-S3: "Sprint của nhóm kéo dài bao lâu? Bao nhiêu Sprint tất cả?"
> Mỗi Sprint kéo dài **2 tuần**. Toàn bộ dự án thực hiện trong khoảng **6–8 Sprint**, tương ứng 3–4 tháng phát triển chính thức (không tính giai đoạn phân tích, thiết kế ban đầu và viết báo cáo).
> - **Sprint 1–2**: Phân tích yêu cầu, thiết kế CSDL, khung Authentication.
> - **Sprint 3–4**: Phân hệ Công dân (báo cáo vấn đề, bản đồ, bình chọn).
> - **Sprint 5–6**: Phân hệ Cán bộ + Quản trị viên, tích hợp AI.
> - **Sprint 7–8**: Content Moderation, Deployment, kiểm thử & hoàn thiện.

### Q-S4: "Product Backlog của nhóm được quản lý thế nào?"
> Product Backlog gồm các **User Story** theo định dạng: *"Với tư cách là [vai trò], tôi muốn [tính năng] để [lợi ích]"*. Mỗi story được ước lượng bằng **Story Points** (Fibonacci: 1, 2, 3, 5, 8) dựa trên độ phức tạp. Backlog được ưu tiên (prioritize) theo giá trị nghiệp vụ: tính năng cốt lõi (báo cáo, xử lý) ưu tiên trước tính năng bổ trợ (thống kê, events). Công cụ: **GitHub Issues + Milestone** hoặc Trello board theo cột To Do / In Progress / Done.

### Q-S5: "Nhóm xử lý thay đổi yêu cầu trong quá trình phát triển thế nào?"
> Đây là một trong những ưu điểm của Scrum so với Waterfall. Khi giảng viên hướng dẫn đề xuất thay đổi (ví dụ: thêm tính năng Spam Report, thêm bước \`need_info\` vào workflow), nhóm ghi nhận vào **Product Backlog**, ưu tiên và đưa vào Sprint tiếp theo — thay vì phải redesign toàn bộ hệ thống như mô hình thác nước. Tính linh hoạt này giúp sản phẩm cuối phù hợp với yêu cầu thực tế hơn.

### Q-S6: "Definition of Done (DoD) của nhóm là gì?"
> Một User Story được coi là **Done** khi đáp ứng đủ:
> 1. Code đã được commit lên nhánh feature và merge vào \`main\` (qua Pull Request).
> 2. API endpoint hoạt động đúng (test bằng Postman/Thunder Client).
> 3. Giao diện Frontend hiển thị đúng trên Chrome (desktop + mobile responsive).
> 4. Không có lỗi console nghiêm trọng.
> 5. Demo được cho Scrum Master xem xét trong Sprint Review.

### Q-S7: "Tại sao chọn Scrum thay vì Waterfall hay Kanban?"
> - **Waterfall** không phù hợp vì yêu cầu đề tài thay đổi liên tục trong quá trình làm (thêm tính năng AI, thêm workflow bước). Phải thiết kế lại toàn bộ nếu dùng Waterfall.
> - **Kanban** phù hợp cho maintenance nhưng thiếu cấu trúc time-box để đảm bảo tiến độ học kỳ.
> - **Scrum** cân bằng tốt: Sprint 2 tuần tạo deadline cụ thể, Sprint Review đảm bảo có sản phẩm chạy được sau mỗi giai đoạn, Retrospective giúp nhóm cải thiện cách làm việc.

### Q-S8: "Nhóm sử dụng công cụ gì để hỗ trợ Scrum?"
> - **GitHub**: Version control, Pull Request workflow, Issues làm User Story, Milestone làm Sprint Goal.
> - **Trello / GitHub Projects**: Kanban board theo dõi sprint backlog (To Do → In Progress → Done).
> - **Discord**: Daily standup bất đồng bộ (gửi update hằng ngày theo format: *Hôm qua làm gì / Hôm nay làm gì / Blocker không?*).
> - **Postman**: Kiểm thử API sau mỗi task backend.
> - **Figma**: Thiết kế UI trước khi code (làm trước Sprint 1).

### Q-S9: "Sprint Retrospective giúp ích gì cho nhóm?"
> Sau mỗi Sprint, nhóm họp Retrospective 30 phút theo format **Start / Stop / Continue**:
> - **Start**: Viết unit test cho các API quan trọng, cập nhật tài liệu song song với code.
> - **Stop**: Để merge code trực tiếp vào main mà không qua Pull Request review.
> - **Continue**: Daily sync qua Discord, phân chia task rõ ràng Backend/Frontend mỗi sprint.
> Kết quả cụ thể: Từ Sprint 4 trở đi nhóm áp dụng bắt buộc Pull Request review trước khi merge, giảm đáng kể bug tích hợp giữa Frontend–Backend.

### Q-S10: "Velocity của nhóm là bao nhiêu? Làm sao đảm bảo tiến độ?"
> Velocity trung bình của nhóm đạt khoảng **20–25 Story Points/Sprint**. Để đảm bảo tiến độ:
> 1. **Sprint Planning** nghiêm túc: Chỉ commit story points bằng 80% velocity dự kiến (buffer cho rủi ro).
> 2. **Burndown chart** theo dõi hằng ngày — nếu thấy tụt tiến độ giữa sprint sẽ điều chỉnh scope (remove story thứ yếu, không thêm scope mới vào sprint đang chạy).
> 3. **Sprint Goal rõ ràng**: Mỗi sprint có 1 mục tiêu chính (ví dụ: "Hoàn thành phân hệ Cán bộ"), tránh bị phân tâm bởi nhiều ưu tiên cùng lúc.
